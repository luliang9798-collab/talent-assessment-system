# ============================================================
# Nginx 反向代理配置（公司内部服务器）
# 将本文件内容保存到：/etc/nginx/conf.d/talent-assessment.conf
# 然后执行：sudo nginx -t && sudo systemctl reload nginx
# 前置：已安装 Nginx，后端服务运行在 127.0.0.1:3000
# ============================================================

server {
    # 监听端口（80 或 443，生产建议 443 + SSL）
    listen 80;
    server_name assessment.your-company.com;   # ← 改为贵公司内部域名或服务器 IP

    # 上传文件大小限制（测评附件等）
    client_max_body_size 20m;

    # 访问与错误日志
    access_log /var/log/nginx/talent-assessment.access.log;
    error_log  /var/log/nginx/talent-assessment.error.log;

    # 反向代理到 Node 后端（API + 静态前端都由后端提供）
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # 支持 WebSocket / SSE（如后续需要）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # 可选：API 单独路径（便于监控与限流）
    # location /api/ {
    #     proxy_pass http://127.0.0.1:3000;
    #     ...同上 proxy 配置...
    # }
}

