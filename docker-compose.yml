version: '3.8'

# ============================================================
# 人才测评系统 - Docker 编排（Node.js + SQLite + Nginx 反代）
# 用法：
#   docker compose up -d --build        # 构建并启动
#   docker compose logs -f app          # 查看后端日志
#   docker compose down                 # 停止并移除容器（数据保留在卷中）
# 数据持久化：app-data 卷挂载到容器内 /app/backend-nodejs/data
# ============================================================

services:
  # ---------- 后端 + 前端一体服务 ----------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: talent-assessment
    restart: unless-stopped
    environment:
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-please-change-this-to-a-strong-secret}
      - DB_PATH=/app/backend-nodejs/data/talent_assessment_new.db
      - LOG_LEVEL=info
    volumes:
      - app-data:/app/backend-nodejs/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ---------- Nginx 反向代理（提供 80/443 入口）----------
  nginx:
    image: nginx:alpine
    container_name: talent-assessment-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      # 如需 HTTPS，取消下行注释并在 docker/nginx/ssl 放置证书
      # - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  app-data:
    driver: local
